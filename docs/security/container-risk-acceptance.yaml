  - id: collector-cve-2026-111943
    images:
      - ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    vulnerability_id: CVE-2026-111943
    packages:
      - stdlib
    owner: repository-maintainer
    reviewed_on: "2026-10-21"
    expires: "2026-10-28"
    remediation_condition:
      Replace with a compatible vendor image built with Go 1.26.10 or 1.27.3, then rescan; review
      again by 2026-10-28.
    rationale:
      The binary's Go x509 verifier predates the denylist for compromised intermediate certificates. The
      checked-in observability endpoints use HTTP and bind to loopback, which narrows but does not remove the
      certificate-trust risk. Accept only until a fixed vendor image is available.
