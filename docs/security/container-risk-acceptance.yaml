    expires: "2026-11-18"
    remediation_condition: >-
      Replace with a compatible official Grafana image embedding Tempo 2.10.3 or later, rescan, and review again by 2026-11-18.
    rationale:
      Trivy reports an older embedded Tempo module in Grafana. The separately deployed Tempo service
      uses local storage and has no S3 SSE-C key configured; the Tempo status endpoint is not hosted by
