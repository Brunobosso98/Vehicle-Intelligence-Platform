  - id: collector-cve-2026-116587
    images:
      - ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    vulnerability_id: CVE-2026-116587
    packages:
      - github.com/go-jose/go-jose/v4
    owner: repository-maintainer
    reviewed_on: "2026-10-30"
    expires: "2026-11-02"
    remediation_condition:
      Replace with a compatible official image embedding go-jose 4.1.6 or later, rescan,
      and review again by 2026-11-02.
    rationale:
      The binary contains go-jose 4.1.5, which is affected when attacker-controlled RSA JWK values
      are parsed. The checked-in Collector pipeline enables only OTLP/HTTP receiving, batch and memory limiting,
      health checks, and OTLP/HTTP exporting; it configures no JWT/JWK authentication extension. Published
      endpoints bind to 127.0.0.1. These controls narrow reachability but do not remove the binary-level
      finding.
  - id: tempo-cve-2026-116587
    images:
      - grafana/tempo:3.0.5@sha256:54bfbf8713813b5eb56e0ddf580553f48f9d55d7d8b15159159c91ecfdb5b949
    vulnerability_id: CVE-2026-116587
    packages:
      - github.com/go-jose/go-jose/v4
    owner: repository-maintainer
    reviewed_on: "2026-10-30"
    expires: "2026-11-02"
    remediation_condition:
      Replace with a compatible official image embedding go-jose 4.1.6 or later, rescan,
      and review again by 2026-11-02.
    rationale:
      The binary contains go-jose 4.1.4, which is affected when attacker-controlled RSA JWK values
      are parsed. The checked-in Tempo configuration uses local block storage and configures no OIDC/JWT/JWK
      authentication. Its published HTTP port binds to 127.0.0.1. These controls narrow reachability but
      do not remove the binary-level finding.
  - id: grafana-cve-2026-116587
    images:
      - grafana/grafana:12.4.14@sha256:ae509d9ae8c1021ca32ec370a9ca975d40165eda9fccd1e1102d317ff8787cd7
    vulnerability_id: CVE-2026-116587
    packages:
      - github.com/go-jose/go-jose/v4
    owner: repository-maintainer
    reviewed_on: "2026-10-30"
    expires: "2026-11-02"
    remediation_condition:
      Replace with a compatible official image embedding go-jose 4.1.6 or later, rescan,
      and review again by 2026-11-02.
    rationale:
      The binary contains go-jose 4.1.4, which is affected when attacker-controlled RSA JWK values
      are parsed. The checked-in Grafana configuration enables anonymous Viewer access and configures no
      OIDC/JWT authentication provider. The service port binds to 127.0.0.1. These controls narrow reachability
      but do not remove the binary-level finding.
  - id: grafana-cve-2026-21728
    images:
      - grafana/grafana:12.4.14@sha256:ae509d9ae8c1021ca32ec370a9ca975d40165eda9fccd1e1102d317ff8787cd7
    vulnerability_id: CVE-2026-21728
    packages:
      - github.com/grafana/tempo
    owner: repository-maintainer
    reviewed_on: "2026-10-30"
    expires: "2026-11-02"
    remediation_condition:
      Replace with a compatible official Grafana image embedding Tempo 2.10.2 or later,
      rescan, and review again by 2026-11-02.
    rationale:
      Trivy reports an older embedded Tempo module in Grafana. The separately deployed Tempo service
      is the patched 3.0.5 image, and Grafana is reachable only on 127.0.0.1 with anonymous Viewer access.
      This limits but does not eliminate local query-resource exposure; the vendored module finding remains
      accepted pending the next compatible Grafana patch.
  - id: grafana-cve-2026-28377
    images:
      - grafana/grafana:12.4.14@sha256:ae509d9ae8c1021ca32ec370a9ca975d40165eda9fccd1e1102d317ff8787cd7
    vulnerability_id: CVE-2026-28377
    packages:
      - github.com/grafana/tempo
    owner: repository-maintainer
    reviewed_on: "2026-10-30"
    expires: "2026-11-02"
    remediation_condition:
      Replace with a compatible official Grafana image embedding Tempo 2.10.3 or later,
      rescan, and review again by 2026-11-02.
    rationale:
      Trivy reports an older embedded Tempo module in Grafana. The separately deployed Tempo service
      uses local storage and has no S3 SSE-C key configured; the Tempo status endpoint is not hosted by
      Grafana. Grafana is reachable only on 127.0.0.1 with anonymous Viewer access. The bundled module finding
      remains accepted pending the next compatible Grafana patch.
