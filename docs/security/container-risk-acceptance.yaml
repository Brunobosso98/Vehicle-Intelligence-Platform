  - id: grafana-cve-2026-21728
    images:
      - grafana/grafana:12.4.13-ubuntu@sha256:410a16811de69aeecd929269357494cca9b9649e68e74f30482520ecb5718737
    vulnerability_id: CVE-2026-21728
    packages:
      - github.com/grafana/tempo
    owner: repository-maintainer
    reviewed_on: "2026-10-23"
    expires: "2026-10-28"
    remediation_condition: Rescan Grafana after the vendor updates its embedded Tempo module; review again by 2026-10-28.
    rationale:
      Grafana bundles a Tempo module version reported by Trivy, but the active Tempo server is the separately
      deployed, fixed 3.0.4 image with no object-storage encryption key configured. Grafana is local-only with anonymous
      Viewer access; retain this exact module finding for review rather than treating the scanner result as remediated.
