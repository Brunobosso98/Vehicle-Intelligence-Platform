    expires: "2026-11-20"
    remediation_condition: >-
      Rebuild and rescan when Debian publishes a fixed SQLite package for Trixie; recheck the
      operator knowledge-ledger schema and trust boundary after any SQLite or knowledge-ingestion change,
      and review again by 2026-11-20.
    rationale: >-
      The API image has libsqlite3-0 3.46.1-7+deb13u2. Debian marks Trixie vulnerable and lists a fixed
      version only in unstable. Application code uses ordinary ledger queries and does not call the
      SQLite session/change-set APIs or accept attacker-supplied change sets or database files. The
      described sqlite3changeset_apply path is not reached by current application code; the system
      package remains present and is not claimed as remediated.
  - id: api-web-cve-2026-85091
    images:
      - vehicle-platform-api:local
      - vehicle-platform-web:local
    vulnerability_id: CVE-2026-85091
    packages:
      - zlib1g
    owner: repository-maintainer
    reviewed_on: "2026-11-06"
    expires: "2026-11-20"
    remediation_condition: >-
      Rebuild and rescan when Debian publishes a fixed zlib package for Trixie; recheck compression
      dependencies and HTTP content-encoding behavior after any API/Web or base-image change, and
      review again by 2026-11-20.
    rationale: >-
      The API/Web images contain zlib1g 1:1.3.dfsg+really1.3.1-1+b1. Debian marks Trixie vulnerable
      and lists a fixed package only in unstable. Repository application code has no direct gzwrite,
      gzprintf, or gzvprintf call; the ingestion boundary explicitly rejects non-identity
      Content-Encoding. The 9B artifact writer uses Python joblib compression, not the vulnerable gz*
      interface. Runtime-library reachability is not fully ruled out, so this is a short-lived risk
      acceptance, not a remediation claim.
  - id: tempo-cve-2026-116587
    images:
      - grafana/tempo:3.0.5@sha256:54bfbf8713813b5eb56e0ddf580553f48f9d55d7d8b15159159c91ecfdb5b949
    vulnerability_id: CVE-2026-116587
    packages:
      - github.com/go-jose/go-jose/v4
    owner: repository-maintainer
    reviewed_on: "2026-11-04"
    expires: "2026-11-18"
    remediation_condition: >-
      Replace with a compatible official Tempo image containing go-jose/v4 4.1.6 or later, rescan, and review again by 2026-11-18.
    rationale:
      The binary contains go-jose 4.1.4, which is affected when attacker-controlled RSA JWK values
      are parsed. The checked-in Tempo configuration uses local block storage and configures no OIDC/JWT/JWK
      authentication. Its published HTTP port binds to 127.0.0.1. These controls narrow reachability but
      do not remove the binary-level finding.
