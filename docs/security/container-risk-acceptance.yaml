  - id: api-web-cve-2026-119373
    images:
      - vehicle-platform-api:local
      - vehicle-platform-web:local
    vulnerability_id: CVE-2026-119373
    packages:
      - libsqlite3-0
    owner: repository-maintainer
    reviewed_on: "2026-11-04"
    expires: "2026-11-18"
    remediation_condition: >-
      Rebuild when Debian publishes fixed SQLite for stable Trixie; keep FTS5 unused and review
      runtime dependencies again by 2026-11-18.
    rationale: >-
      The canonical scan found libsqlite3-0 3.46.1-7+deb13u2 in API and Web. Debian lists
      Trixie as vulnerable and the fixed package only in unstable. This defect requires a
      detail=none FTS5 table with negative rowids followed by a prefix MATCH query; the
      application creates no FTS5 tables or MATCH queries. Its SQLite ledger uses ordinary
      tables and parameterized queries, while vehicle data uses PostgreSQL. Keep this exact
      image/CVE/package exception visible until a stable fix is available.
  - id: api-web-cve-2026-76844
    images:
      - vehicle-platform-api:local
      - vehicle-platform-web:local
    vulnerability_id: CVE-2026-76844
    packages:
      - zlib1g
    owner: repository-maintainer
    reviewed_on: "2026-11-05"
    expires: "2026-11-12"
    remediation_condition: >-
      Rebuild and rescan as soon as Debian publishes a fixed zlib package for stable Trixie; otherwise
      review this exact finding and current exploitability evidence no later than 2026-11-12.
    rationale: >-
      The refreshed Trivy database found zlib1g 1:1.3.dfsg+really1.3.1-1+b1 in the pinned API and
      Web bases. Debian bug #1153063 reports Trixie as vulnerable and provides a backport patch, but
      no fixed stable package is published. The issue requires a failed underlying write followed
      by another gz* write. Repository code contains no direct zlib or gzip API calls; inbound
      Content-Encoding: gzip is explicitly unsupported. Runtime-library reachability is not ruled
      out, so this remains a short-lived High exception rather than a claim of remediation.
  - id: api-cve-2026-119374
    images:
      - vehicle-platform-api:local
    vulnerability_id: CVE-2026-119374
    packages:
      - libsqlite3-0
    owner: repository-maintainer
    reviewed_on: "2026-11-06"
    expires: "2026-11-20"
    remediation_condition: >-
      Rebuild and rescan when Debian publishes a fixed SQLite package for Trixie; recheck the
      operator knowledge-ledger schema and trust boundary after any SQLite or knowledge-ingestion change,
      and review again by 2026-11-20.
    rationale: >-
      The API image has libsqlite3-0 3.46.1-7+deb13u2. Debian marks Trixie vulnerable and lists a fixed
      version only in unstable. The application ledger creates only ordinary requests/cache/counters
      tables, does not issue FTS5 MATCH queries or enable secure_delete, and does not accept uploaded
      SQLite databases. The reported FTS5 secure-delete path is not reached by current application code;
      the system package remains present and is not claimed as remediated.
  - id: api-cve-2026-119379
    images:
      - vehicle-platform-api:local
