  - id: collector-cve-2026-78667
    images:
      - ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    vulnerability_id: CVE-2026-78667
    packages:
      - stdlib
    owner: repository-maintainer
    reviewed_on: "2026-10-21"
    expires: "2026-10-28"
    remediation_condition:
      Replace with a compatible vendor image built with Go 1.26.9 or 1.27.2, then rescan; review
      again by 2026-10-28.
    rationale:
      Go net/http Range parsing is classified High. The service is reachable only on the local observability
      profile bound to 127.0.0.1; this limits exposure but does not remove the finding.
