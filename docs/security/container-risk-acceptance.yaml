    packages:
      - golang.org/x/net
    owner: repository-maintainer
    reviewed_on: "2026-11-21"
    expires: "2026-12-05"
    remediation_condition: >-
      Replace with a compatible official Collector image containing golang.org/x/net 0.62.0 or
      later, rescan, and review again by 2026-12-05.
    rationale: >-
      The exact scan reports golang.org/x/net v0.61.0; CVE-2026-78661 is quadratic allocation
      while parsing hostile HTML. Collector host ports bind to loopback and the configured
      application path uses OTLP, not attacker-supplied HTML. The finding remains visible and is
      accepted only for this loopback development stack pending a compatible upstream image.
