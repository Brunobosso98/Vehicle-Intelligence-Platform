  - id: otel-cve-2026-78661
    images:
      - ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.164.0@sha256:28b6d41ac51bff6b41ba5e8fe503569ffb9d6a1ea90f7a78419e86f34e44f750
