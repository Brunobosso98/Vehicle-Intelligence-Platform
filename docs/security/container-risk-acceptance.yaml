version: 1
exceptions:
  - id: api-web-cve-2025-69720
    images: ["vehicle-platform-api:local", "vehicle-platform-web:local"]
    vulnerability_id: CVE-2025-69720
    packages: ["libncursesw6", "libtinfo6", "ncurses-base", "ncurses-bin"]
    owner: repository-maintainer
    expires: 2026-11-01
    rationale: "The affected infocmp CLI is not invoked by either service; containers are non-root, read-only, and expose no shell-driven input."
  - id: api-web-cve-2026-16742
    images: ["vehicle-platform-api:local", "vehicle-platform-web:local"]
    vulnerability_id: CVE-2026-16742
    packages: ["libsystemd0", "libudev1"]
    owner: repository-maintainer
    expires: 2026-11-01
    rationale: "The exploit path requires systemd-homed/local logged-in users; these service containers run neither systemd nor homed."
  - id: api-web-cve-2026-54369
    images: ["vehicle-platform-api:local", "vehicle-platform-web:local"]
    vulnerability_id: CVE-2026-54369
    packages: ["libacl1"]
    owner: repository-maintainer
    expires: 2026-11-01
    rationale: "The affected privileged ACL pathname path is not used; services are non-root with read-only roots."
  - id: api-web-cve-2026-76642
    images: ["vehicle-platform-api:local", "vehicle-platform-web:local"]
    vulnerability_id: CVE-2026-76642
    packages: ["bsdutils", "libblkid1", "liblastlog2-2", "libmount1", "libsmartcols1", "libuuid1", "login", "mount", "util-linux"]
    owner: repository-maintainer
    expires: 2026-11-01
