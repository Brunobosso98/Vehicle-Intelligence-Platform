  - id: api-web-cve-2026-78409
    images: ["vehicle-platform-api:local", "vehicle-platform-web:local"]
    vulnerability_id: CVE-2026-78409
    packages: ["bsdutils", "libblkid1", "liblastlog2-2", "libmount1", "libsmartcols1", "libuuid1", "login", "mount", "util-linux"]
    owner: repository-maintainer
