  - id: grafana-cve-2026-100352
    images:
      - grafana/grafana:12.4.13-ubuntu@sha256:410a16811de69aeecd929269357494cca9b9649e68e74f30482520ecb5718737
    vulnerability_id: CVE-2026-100352
    packages:
      - github.com/getkin/kin-openapi
    owner: repository-maintainer
    reviewed_on: "2026-10-23"
    expires: "2026-10-28"
    remediation_condition:
      Upgrade to a Grafana release embedding kin-openapi 0.148.0 or later and rescan; review
      again by 2026-10-28.
    rationale:
      The pinned Grafana 12.4.13 image contains kin-openapi 0.147.0; the advisory fixes this YAML/OAS 3.1
      validation panic in 0.148.0. The Grafana endpoint is local-only with anonymous Viewer access. Reachability of
      the vulnerable validation path in Grafana is not established by the image scan, so this is a short, finding-specific
      acceptance pending the next vendor patch.
