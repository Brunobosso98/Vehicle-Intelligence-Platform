  - id: grafana-cve-2026-21728
    images:
      - grafana/grafana:12.4.14@sha256:ae509d9ae8c1021ca32ec370a9ca975d40165eda9fccd1e1102d317ff8787cd7
    vulnerability_id: CVE-2026-21728
    packages:
      - github.com/grafana/tempo
    owner: repository-maintainer
    reviewed_on: "2026-11-04"
    expires: "2026-11-18"
    remediation_condition: >-
      Replace with a compatible official Grafana image embedding Tempo 2.10.2 or later, rescan, and review again by 2026-11-18.
    rationale:
      Trivy reports an older embedded Tempo module in Grafana. The separately deployed Tempo service
      is the patched 3.0.5 image, and Grafana is reachable only on 127.0.0.1 with anonymous Viewer access.
      This limits but does not eliminate local query-resource exposure; the vendored module finding remains
      accepted pending the next compatible Grafana patch.
  - id: grafana-cve-2026-28377
    images:
      - grafana/grafana:12.4.14@sha256:ae509d9ae8c1021ca32ec370a9ca975d40165eda9fccd1e1102d317ff8787cd7
    vulnerability_id: CVE-2026-28377
