  - id: api-web-cve-2026-78410
    images: ["vehicle-platform-api:local", "vehicle-platform-web:local"]
    vulnerability_id: CVE-2026-78410
    packages: ["bsdutils", "libblkid1", "liblastlog2-2", "libmount1", "libsmartcols1", "libuuid1", "login", "mount", "util-linux"]
    owner: repository-maintainer
    expires: 2026-11-01
    rationale: "The exploit requires SUID mount/fstab bind mount control; no such path or capability exists in the services."
  - id: api-web-cve-2026-9538
