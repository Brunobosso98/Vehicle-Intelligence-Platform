[project]
name = "vehicle-platform-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi==0.142.2", "uvicorn[standard]==0.54.0", "pydantic-settings==2.15.0", "sqlalchemy[asyncio]==2.1.1", "python-multipart==0.0.31",
 "asyncpg==0.31.0", "alembic==1.20.0", "opentelemetry-sdk==1.45.0", "opentelemetry-exporter-otlp-proto-http==1.45.0",
 "opentelemetry-exporter-prometheus==0.66b0", "opentelemetry-instrumentation-sqlalchemy==0.66b0",
]
[dependency-groups]
dev = ["ruff==0.16.10", "mypy==2.3.1", "pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-cov==7.1.0", "httpx==0.28.1", "pip-audit==2.10.1", "pyyaml==6.0.3"]
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_platform"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"migrations/**" = ["E501"]
"src/vehicle_platform/api/routes.py" = ["E501", "B008", "S608"]
"src/vehicle_platform/telemetry/domain.py" = ["S311"] # deterministic fixtures, not security
"src/vehicle_platform/telemetry/service.py" = ["E501"] # SQL kept intact for query review
"src/vehicle_platform/analysis/service.py" = ["E501", "S608"] # bounded SQL variants kept intact for query review
"src/vehicle_platform/events/service.py" = ["E501", "S608"] # bounded SQL variants kept intact for query review
"src/vehicle_platform/analysis/synthetic.py" = ["S311"] # deterministic fixtures, not security
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: disposable PostgreSQL/Timescale database required"]
[tool.coverage.run]
branch = true
source = ["vehicle_platform"]
omit = [
 "*/vehicle_platform/api/routes.py", # HTTP/database paths run against disposable TimescaleDB
 "*/vehicle_platform/telemetry/service.py", # bulk SQL/idempotency requires real transaction semantics
 "*/vehicle_platform/analysis/service.py", # derived persistence/idempotency requires real transaction semantics
 "*/vehicle_platform/events/service.py", # event persistence/idempotency requires real transaction semantics
]
[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pydantic-mypy]
init_typed = true
