name: vehicle-platform
services:
  db:
    image: vehicle-platform-timescaledb:local
    build:
      context: .
      dockerfile: infra/docker/timescaledb/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run make bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make bootstrap}
      POSTGRES_DB: ${POSTGRES_DB:?Run make bootstrap}
      TIMESCALEDB_TELEMETRY: "off"
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: vehicle-platform-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-1970-01-01T00:00:00Z}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ENVIRONMENT: development
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  api:
    image: vehicle-platform-api:local
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ENVIRONMENT: development
      APP_VERSION: ${APP_VERSION:-0.1.0}
      NO_PROXY: localhost,127.0.0.1,api,db,otel-collector,tempo
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  web:
    image: vehicle-platform-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-1970-01-01T00:00:00Z}
    environment:
      API_BASE_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  otel-collector:
    profiles: ["observability"]
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      ["./infra/docker/observability/collector.yaml:/etc/otel/config.yaml:ro"]
    ports: ["127.0.0.1:13133:13133"]
    depends_on: ["tempo"]
  prometheus:
    profiles: ["observability"]
    image: quay.io/prometheus/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    volumes:
      [
        "./infra/docker/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro",
        "prometheus-data:/prometheus",
      ]
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.retention.time=7d",
      ]
    ports: ["127.0.0.1:9090:9090"]
  tempo:
    profiles: ["observability"]
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      [
        "./infra/docker/observability/tempo.yaml:/etc/tempo.yaml:ro",
        "tempo-data:/var/tempo",
      ]
    ports: ["127.0.0.1:3200:3200"]
  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.4.12@sha256:83be3e511ede559bee80e2215bb1987cb1246075461cb961beb515b0341e7aea
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      [
        "./infra/docker/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/default.yaml:ro",
        "./infra/docker/observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/default.yaml:ro",
        "./infra/docker/observability/dashboard.json:/var/lib/grafana/dashboards/foundation.json:ro",
      ]
    ports: ["127.0.0.1:3001:3000"]
volumes:
  postgres-data:
  prometheus-data:
  tempo-data:
