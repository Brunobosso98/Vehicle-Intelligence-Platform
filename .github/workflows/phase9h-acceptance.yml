name: Phase 9H acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase9h-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent-acceptance:
    name: Phase 9H independent UI acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.12.19
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install locked dependencies and Chromium
        run: |
          make bootstrap
          pnpm --filter @vehicle-platform/web exec playwright install --with-deps chromium
      - name: Generate fresh Phase 9G oracle and check the static research snapshot
        run: |
          make phase9g-acceptance
          apps/api/.venv/bin/python scripts/check_phase9h_research_summary.py --report .validation/phase9g/acceptance.json
      - name: Run actual 9D/9E API, disposable database, protected Next BFF and browser acceptance
        run: make phase9h-acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase9h-independent-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .validation/phase9h
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 14
