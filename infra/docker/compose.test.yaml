services:
  db:
    image: ${TEST_DB_IMAGE:-vehicle-platform-timescaledb:local}
    build:
      context: ../..
      dockerfile: infra/docker/timescaledb/Dockerfile
    environment:
      POSTGRES_USER: vehicle
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: vehicle_test
      PGDATA: /var/lib/postgresql/data/pgdata
      TIMESCALEDB_TELEMETRY: "off"
    ports: ["127.0.0.1::5432"]
    tmpfs: ["/var/lib/postgresql/data:mode=1777"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vehicle -d vehicle_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  broker:
    image: vehicle-platform-kafka:local
    environment:
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,EXTERNAL://127.0.0.1:${TEST_KAFKA_PORT:?Disposable test port required}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["127.0.0.1:${TEST_KAFKA_PORT}:9094"]
    tmpfs: ["/tmp/kraft-combined-logs:mode=1777"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
